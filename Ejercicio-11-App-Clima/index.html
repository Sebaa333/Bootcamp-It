<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Clima</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>

    <header>
      <nav class="navbar main-navbar" data-bs-theme="dark">
        <div class="container-fluid">
          <span class="navbar-brand">
            <i class="fa-solid fa-cloud-sun"></i> App Clima
          </span>
        </div>
      </nav>
    </header>

    <main class="app-main">

      <div class="weather-container">

        <!-- Buscador -->
        <div class="weather-input-container d-flex gap-2">
          <input
            type="text"
            id="input-ciudad"
            class="weather-input"
            placeholder="Buscar ciudad..."
          />
          <button class="btn btn-primary btn-sm" id="btn-guardar" disabled title="Guardar ciudad">
            <i class="fa-solid fa-floppy-disk"></i>
          </button>
          <button class="btn btn-outline-light btn-sm" id="btn-limpiar" title="Limpiar ciudad guardada">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>

        <!-- Información del clima -->
        <div class="weather-info">

          <div class="weather-info__icon">
            <img id="icono" src="" alt="Ícono del clima" />
          </div>

          <div class="weather-info__city" id="ciudad">-</div>

          <div class="weather-info__temp">
            <span id="temperatura">-</span>
            <div class="weather-info__minmax">
              <span id="temp-max">-</span>
              <span id="temp-min">-</span>
            </div>
          </div>

          <div class="weather-info__description" id="descripcion">-</div>

          <div class="weather-info__details">
            <div class="weather-detail">
              <span class="detail-label"><i class="fa-solid fa-temperature-half"></i> Sensación</span>
              <span class="detail-value" id="sensacion">-</span>
            </div>
            <div class="weather-detail">
              <span class="detail-label"><i class="fa-solid fa-droplet"></i> Humedad</span>
              <span class="detail-value" id="humedad">-</span>
            </div>
            <div class="weather-detail">
              <span class="detail-label"><i class="fa-solid fa-wind"></i> Viento</span>
              <span class="detail-value" id="viento">-</span>
            </div>
          </div>

          <div class="weather-info__datetime" id="fecha-hora">-</div>

        </div>

      </div>

    </main>

  <div class="background">
    <div class="cube"></div>
    <div class="cube"></div>
    <div class="cube"></div>
    <div class="cube"></div>
    <div class="cube"></div>
  </div>

    <script src="js/app.js"></script>
  </body>
</html>
