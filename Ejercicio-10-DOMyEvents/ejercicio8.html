<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 8 - Formulario con validación</title>
  <link rel="stylesheet" href="css/ejercicio8.css">
</head>
<body>

  <h1>Crear cuenta</h1>

  <form id="form-registro" novalidate>

    <div class="campo">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="Ej: Ana García">
      <p class="mensaje-error" id="error-nombre"></p>
    </div>

    <div class="campo">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Ej: ana@email.com">
      <p class="mensaje-error" id="error-email"></p>
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Mínimo 8 caracteres">
      <p class="mensaje-error" id="error-password"></p>
    </div>

    <button type="submit">Crear cuenta</button>

  </form>

  <div id="exito">¡Cuenta creada exitosamente! Bienvenido/a 🎉</div>

  <script src="js/ejercicio8.js"></script>
</body>
</html>
